name: tests

# PHP tests on GitHub's runners (the dev laptop can't run php.exe).
on:
  push:
  pull_request:

# The repo is public and anyone can open a pull request: the job only ever
# needs to read the code.
permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring, intl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test --log-junit junit.xml

      - name: Name the failed tests
        # A job's log needs a GitHub sign-in to read; its annotations don't.
        if: failure()
        run: python3 .github/scripts/annotate_junit.py junit.xml
